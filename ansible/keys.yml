keys:
  actual_subdomain:
    secret: false
    doc: "Subdomain for the Actual Budget sync server"

  actual_tailscale_ip:
    secret: false
    doc: "Tailscale IP address of the Actual Budget host"

  admin_user_email:
    secret: false
    doc: "Email address for the admin user account"

  admin_user_name:
    secret: false
    doc: "Username for the admin user account"

  admin_user_password:
    secret: true
    doc: "Password for the admin user account"

  baikal_admin_password:
    secret: true
    doc: "Password for the Baïkal CalDAV/CardDAV admin interface"

  baikal_busy_feed_token:
    secret: true
    doc: "Token for the X-Auberge-Busy-Token header that gates the Busy Feed (/busy.ics); guards the busy/free pattern, protects no event detail (ADR-0010)."

  baikal_busy_icloud_app_password:
    secret: true
    doc: "Apple app-specific password for iCloud CalDAV merged into the Busy Feed (optional). Stays on the VPS; never sent to Google (ADR-0010)."

  baikal_busy_icloud_calendar:
    secret: false
    doc: "Which iCloud calendar to merge into the Busy Feed: its display name, or a full CalDAV URL; empty = all calendars (optional)."

  baikal_busy_icloud_username:
    secret: false
    doc: "Apple ID email for the iCloud CalDAV account whose calendar feeds the Busy Feed (optional)."

  baikal_subdomain:
    secret: false
    doc: "Subdomain for the Baïkal CalDAV/CardDAV server"

  bichon_api_token:
    secret: true
    doc: "Bearer token used by the Bichon archive timer to call Bichon's REST API. Generate it once in Bichon's UI."

  bichon_encryption_password:
    secret: true
    doc: "Encryption password for Bichon data-at-rest"

  bichon_subdomain:
    secret: false
    doc: "Subdomain for the Bichon service"

  bichon_tailscale_ip:
    secret: false
    doc: "Tailscale IP address of the Bichon host"

  blocky_subdomain:
    secret: false
    doc: "Subdomain for the Blocky DNS server"

  calibre_subdomain:
    secret: false
    doc: "Subdomain for the Calibre-Web e-book library"

  cloudflare_dns_api_token:
    secret: true
    doc: "Cloudflare API token with DNS edit permissions for ACME/Let's Encrypt challenges"

  colporteur_feeds_password:
    secret: true
    doc: "Password used to protect Colporteur feed endpoints"

  colporteur_freshrss_sync:
    secret: false
    doc: "Whether Colporteur should sync feeds to FreshRSS (true/false)"

  colporteur_subdomain:
    secret: false
    doc: "Subdomain for the Colporteur feed aggregator"

  domain:
    secret: false
    doc: "Primary domain name used for all services (e.g. example.com)"

  fail2ban_ignoreip_extra:
    secret: false
    doc: "Space-separated operator IPs/CIDRs fail2ban must never ban (optional); loopback, tailnet CGNAT, and Inventory host IPs are always ignored."

  freshrss_subdomain:
    secret: false
    doc: "Subdomain for the FreshRSS feed reader"

  github_bot_login:
    secret: false
    doc: "GitHub machine-user handle the fleet commits as (ADR-0054); target of `auberge github invite|verify`"

  github_bot_repos:
    secret: false
    doc: "Space-separated owner/repo allowlist the machine user gets push access to via `auberge github invite`"

  github_bot_token:
    secret: true
    doc: "Fine-grained PAT for the GitHub machine user (all-repositories, Contents+Pull-requests RW); e.g. !pa show fleet/github-pat"

  gokapi_admin_password:
    secret: true
    doc: "Password for the Gokapi admin account (entered manually in /setup wizard on first deploy)"

  gokapi_admin_user:
    secret: false
    doc: "Username for the Gokapi admin account (entered manually in /setup wizard on first deploy)"

  gokapi_subdomain:
    secret: false
    doc: "Subdomain for the Gokapi file-sharing service"

  grimmory_admin_password:
    secret: true
    doc: "Password for the Grimmory admin account"

  grimmory_admin_user:
    secret: false
    doc: "Username for the Grimmory admin account"

  grimmory_db_password:
    secret: true
    doc: "Database password for Grimmory"

  grimmory_subdomain:
    secret: false
    doc: "Subdomain for the Grimmory service"

  headscale_subdomain:
    secret: false
    doc: "Subdomain for the Headscale control server; unset means Headscale is not deployed"

  hermes_exa_api_key:
    secret: true
    doc: "Exa search API key used by Hermes"

  hermes_llm_api_key:
    secret: true
    doc: "API key for the LLM provider used by Hermes"

  hermes_llm_provider:
    secret: false
    doc: "LLM provider identifier for Hermes (e.g. openai, anthropic)"

  hermes_telegram_allowed_users:
    secret: false
    doc: "Comma-separated list of Telegram usernames allowed to interact with Hermes"

  hermes_telegram_bot_token:
    secret: true
    doc: "Telegram bot token for the Hermes bot"

  immich_b2_application_key:
    secret: true
    doc: "B2 application key the Immich Host backs up with — crippled, created without deleteFiles so a compromised box can add but never destroy (#558)"

  immich_b2_key_id:
    secret: false
    doc: "Key ID of the crippled B2 application key the Immich Host backs up with (#558)"

  immich_db_password:
    secret: true
    doc: "Password for Immich's PostgreSQL database (containers only; upstream allows only A-Za-z0-9)"

  immich_restic_password:
    secret: true
    doc: "Encryption password for Immich's dedicated B2 restic repository"

  immich_restic_repository:
    secret: false
    doc: "Immich's dedicated restic repository URL (s3: URL of the B2 bucket, e.g. s3:https://s3.eu-central-003.backblazeb2.com/bucket)"

  immich_subdomain:
    secret: false
    doc: "Subdomain for the Immich photo server"

  memsearch_sync_device_id:
    secret: false
    doc: >-
      Syncthing device ID of the peer holding the off-box copy of the agent memory store.
      The peer initiates: the tailnet ACL denies `tag:agent -> tag:trusted` (ADR-0055).

  memsearch_sync_device_name:
    secret: false
    doc: "Display name for that Syncthing peer, as it appears in the agent Host's device list."

  navidrome_subdomain:
    secret: false
    doc: "Subdomain for the Navidrome music server"

  opencode_openrouter_api_key:
    secret: true
    doc: "OpenRouter API key the OpenCode agent runtime authenticates with; the sole model credential on the agent Host (ADR-0054)."

  paperless_admin_password:
    secret: true
    doc: "Password for the Paperless-ngx admin account"

  paperless_admin_user:
    secret: false
    doc: "Username for the Paperless-ngx admin account"

  paperless_db_password:
    secret: true
    doc: "Database password for Paperless-ngx"

  paperless_secret_key:
    secret: true
    doc: "Django secret key for Paperless-ngx"

  paperless_subdomain:
    secret: false
    doc: "Subdomain for the Paperless-ngx document management service"

  paperless_tailscale_ip:
    secret: false
    doc: "Tailscale IP address of the Paperless-ngx host"

  radio_listener_password:
    secret: true
    doc: "Shared password gating every Radio stream behind Caddy basic auth (ADR-0020); rotating it revokes every listener at once"

  radio_subdomain:
    secret: false
    doc: "Subdomain for the Radio streaming server"

  restic_password:
    secret: true
    doc: "Encryption password for the restic backup repository"

  restic_repository:
    secret: false
    doc: "Restic repository URL (e.g. s3:https://... or /path/to/repo)"

  ssh_port:
    secret: false
    doc: "SSH port to configure on the remote server during bootstrap"

  tailscale_api_key:
    secret: true
    doc: "Tailscale API key used for node management"

  tailscale_authkey:
    secret: true
    injected: true
    doc: "Pre-auth key registering a new node; minted per run by the CLI, set only to override (#768)"

  tailscale_login_server:
    secret: false
    doc: "URL of the Tailscale/Headscale login server (leave empty for official Tailscale)"

  tgtg_telegram_bot_token:
    secret: true
    doc: "Telegram bot token for the Too Good To Go notifier bot"

  yourls_admin_password:
    secret: true
    doc: "Password for the YOURLS admin account"

  yourls_admin_user:
    secret: false
    doc: "Username for the YOURLS admin account"

  yourls_api_signature:
    secret: true
    doc: "YOURLS API signature token"

  yourls_cookiekey:
    secret: true
    doc: "Secret cookie key for YOURLS session security"

  yourls_db_password:
    secret: true
    doc: "Database password for YOURLS"

  yourls_subdomain:
    secret: false
    doc: "Subdomain for the YOURLS URL shortener"
