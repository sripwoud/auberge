---
aoe_user: "{{ admin_user_name }}"
aoe_group: "{{ admin_user_name }}"
aoe_home: "/home/{{ aoe_user }}"

aoe_subdomain: essaim
aoe_domain: "{{ aoe_subdomain }}.{{ agents_domain }}"

aoe_install_dir: /usr/local/bin
aoe_binary_path: "{{ aoe_install_dir }}/aoe"
aoe_asset_name: aoe-linux-amd64
aoe_archive_url: "https://github.com/agent-of-empires/agent-of-empires/releases/download/v{{ aoe_version }}/{{ aoe_asset_name }}.tar.gz"
# Both paths carry the version because the release asset's name does not:
# `get_url` with a version-agnostic dest degrades to a conditional GET, and a
# bumped pin then fetches nothing at all (ADR-0027).
aoe_archive_path: "/tmp/{{ aoe_asset_name }}-{{ aoe_version }}.tar.gz"
aoe_staging_dir: "/tmp/aoe-{{ aoe_version }}"
# The tarball holds one file, named after the release target rather than after
# the command, so the install is an unpack into staging and a copy onto the
# path the unit execs.
aoe_unpacked_binary: "{{ aoe_staging_dir }}/{{ aoe_asset_name }}"

aoe_config_dir: "{{ aoe_home }}/.config/aoe"
aoe_env_path: "{{ aoe_config_dir }}/serve.env"
aoe_systemd_user_dir: "{{ aoe_home }}/.config/systemd/user"

# Loopback only. Caddy is the one thing that reaches the dashboard, and it
# terminates TLS for it; a bind on the tailnet address would be a second,
# plaintext, unauthenticated-by-Caddy way in.
aoe_bind_host: 127.0.0.1
aoe_port: 8080
