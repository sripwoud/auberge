---
- name: Headscale Control Server Deployment
  block:
    - name: Create headscale system group
      ansible.builtin.group:
        name: "{{ headscale_sys_group }}"
        system: true
        state: present

    - name: Create headscale system user
      ansible.builtin.user:
        name: "{{ headscale_sys_user }}"
        group: "{{ headscale_sys_group }}"
        system: true
        create_home: false
        home: "{{ headscale_data_dir }}"
        shell: /usr/sbin/nologin
        state: present

    - name: Create headscale config directory
      ansible.builtin.file:
        path: "{{ headscale_config_dir }}"
        state: directory
        owner: root
        group: "{{ headscale_sys_group }}"
        mode: "0750"

    - name: Create headscale data directory
      ansible.builtin.file:
        path: "{{ headscale_data_dir }}"
        state: directory
        owner: "{{ headscale_sys_user }}"
        group: "{{ headscale_sys_group }}"
        mode: "0750"

    - name: Check installed headscale version
      ansible.builtin.stat:
        path: "{{ headscale_data_dir }}/version"
      register: headscale_version_file

    - name: Check installed headscale binary
      ansible.builtin.stat:
        path: "{{ headscale_binary_path }}"
      register: headscale_binary_stat

    - name: Read installed headscale version
      ansible.builtin.slurp:
        src: "{{ headscale_data_dir }}/version"
      register: headscale_version_content
      when: headscale_version_file.stat.exists

    - name: Set installed version fact
      ansible.builtin.set_fact:
        headscale_installed_version: >-
          {{ (headscale_version_content.content | b64decode | trim)
             if headscale_version_file.stat.exists and headscale_binary_stat.stat.exists
             else '' }}

    - name: Download headscale binary
      ansible.builtin.get_url:
        url: "{{ headscale_release_url }}"
        dest: /tmp/headscale
        mode: "0755"
        checksum: "{{ headscale_release_checksum }}"
      when: headscale_installed_version != headscale_version

    - name: Install headscale binary
      ansible.builtin.copy:
        src: /tmp/headscale
        dest: "{{ headscale_binary_path }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      when: headscale_installed_version != headscale_version
      notify: Restart headscale

    - name: Remove temporary download
      ansible.builtin.file:
        path: /tmp/headscale
        state: absent
      when: headscale_installed_version != headscale_version

    - name: Get Tailscale status for tailnet IP discovery
      ansible.builtin.command: tailscale status --json
      register: headscale_tailscale_status_raw
      changed_when: false
      failed_when: false

    - name: Set the host's Tailscale IPv4 fact
      ansible.builtin.set_fact:
        headscale_tailscale_ipv4: "{{ (headscale_tailscale_status_raw.stdout | from_json).Self.TailscaleIPs | select('match', '^[0-9]+\\.') | first }}"
      when:
        - headscale_tailscale_status_raw.rc is defined
        - headscale_tailscale_status_raw.rc == 0
        - (headscale_tailscale_status_raw.stdout | from_json).BackendState == "Running"

    - name: Check deployed headscale configuration
      ansible.builtin.stat:
        path: "{{ headscale_config_dir }}/config.yaml"
      register: headscale_config_stat

    - name: Read deployed headscale configuration
      ansible.builtin.slurp:
        src: "{{ headscale_config_dir }}/config.yaml"
      register: headscale_deployed_config
      when: headscale_config_stat.stat.exists

    - name: Set deployed global nameserver fact
      ansible.builtin.set_fact:
        headscale_deployed_global_nameserver: "{{ (headscale_deployed_config.content | b64decode | from_yaml).dns.nameservers.global | first }}"
      when: headscale_config_stat.stat.exists

    - name: Refuse to downgrade the tailnet to an unfiltered resolver
      ansible.builtin.fail:
        msg: >-
          tailscale status reports no tailnet IPv4 for this host, but
          {{ headscale_config_dir }}/config.yaml already serves
          {{ headscale_deployed_global_nameserver }} as the tailnet's global
          resolver. Rendering the public fallback over it would leave every
          enrolled client unfiltered. Repair tailscaled here, then redeploy.
      when:
        - headscale_tailscale_ipv4 is not defined
        - headscale_deployed_global_nameserver is defined
        - headscale_deployed_global_nameserver not in headscale_fallback_nameservers

    - name: Auto-derive headscale_split_dns_target_ip from the discovered Tailscale IPv4
      ansible.builtin.set_fact:
        headscale_split_dns_target_ip: "{{ headscale_tailscale_ipv4 }}"
      when:
        - headscale_split_dns_target_ip | length == 0
        - headscale_tailscale_ipv4 is defined
        - headscale_tailscale_ipv4 | length > 0

    - name: Deploy headscale ACL policy
      ansible.builtin.copy:
        src: policy.hujson
        dest: "{{ headscale_policy_path }}"
        owner: root
        group: "{{ headscale_sys_group }}"
        mode: "0640"
      notify: Restart headscale

    - name: Deploy headscale configuration
      ansible.builtin.template:
        src: headscale-config.yaml.j2
        dest: "{{ headscale_config_dir }}/config.yaml"
        owner: root
        group: "{{ headscale_sys_group }}"
        mode: "0640"
      notify: Restart headscale

    - name: Deploy headscale systemd service
      ansible.builtin.template:
        src: headscale.service.j2
        dest: /etc/systemd/system/headscale.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart headscale

    - name: Enable and start headscale service
      ansible.builtin.systemd_service:
        name: headscale
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers so a pending headscale restart lands before the probe
      ansible.builtin.meta: flush_handlers

    - name: Wait for headscale to listen on its loopback port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ headscale_port }}"
        timeout: 30

    - name: Deploy Caddy site configuration for headscale
      ansible.builtin.template:
        src: headscale.caddyfile.j2
        dest: "/etc/caddy/sites/{{ headscale_domain }}.caddyfile"
        owner: root
        group: root
        mode: "0644"
      notify: Restart caddy

    - name: Write installed headscale version
      ansible.builtin.copy:
        content: "{{ headscale_version }}"
        dest: "{{ headscale_data_dir }}/version"
        owner: "{{ headscale_sys_user }}"
        group: "{{ headscale_sys_group }}"
        mode: "0644"
      when: headscale_installed_version != headscale_version

    - name: Display headscale deployment summary
      ansible.builtin.debug:
        msg: |
          Headscale deployed:
            URL: {{ headscale_server_url }}
            Config: {{ headscale_config_dir }}/config.yaml
            Data: {{ headscale_data_dir }}
            DERP: {{ 'embedded (region ' ~ headscale_derp_region_id ~ ')' if headscale_derp_enabled else 'disabled' }}
            Relay fallback: {{ headscale_derp_urls | length }} remote DERP map(s)
            Status: systemctl status headscale
          Next steps:
            1. headscale users create default
            2. headscale preauthkeys create --user default --reusable --expiration 24h
            3. Set tailscale_authkey and tailscale_login_server in config.toml
