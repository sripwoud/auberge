---
headscale_port: 8080
headscale_metrics_port: 9091
headscale_stun_port: 3478
headscale_sys_user: headscale
headscale_sys_group: headscale
headscale_config_dir: /etc/headscale
headscale_data_dir: /var/lib/headscale
headscale_binary_path: /usr/local/bin/headscale
headscale_db_path: /var/lib/headscale/db.sqlite
headscale_domain: "{{ headscale_subdomain }}.{{ domain }}"
headscale_server_url: "https://{{ headscale_domain }}"
headscale_ip_prefix_v4: "100.64.0.0/10"
headscale_ip_prefix_v6: "fd7a:115c:a1e0::/48"
headscale_magic_dns_enabled: true
headscale_base_domain: "ts.{{ domain }}"
headscale_derp_enabled: true
headscale_derp_region_id: 999
headscale_derp_region_name: "self-hosted"
headscale_derp_urls:
  - "https://controlplane.tailscale.com/derpmap/default"
headscale_derp_update_frequency: 24h
headscale_log_level: info
headscale_split_dns_target_ip: ""
headscale_fallback_nameservers:
  - 1.1.1.1
  - 1.0.0.1
headscale_release_url: "https://github.com/juanfont/headscale/releases/download/v{{ headscale_version }}/headscale_{{ headscale_version }}_linux_amd64"
headscale_release_checksum: "sha256:8dc183758024ed7095cf610fedea0790233613c71353bc8be2715d82ba29b92c"
