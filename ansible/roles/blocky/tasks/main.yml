- name: Create group
  ansible.builtin.group:
    name: blocky

- name: Create user
  ansible.builtin.user:
    name: blocky
    group: blocky
    create_home: false
    system: true

- name: Ensure install, conf and certs dirs exist
  with_items: [
    "{{ blocky_install_path }}",
    "{{ blocky_config_path }}",
  ]
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
    group: blocky
    owner: blocky
    state: directory
    recurse: true

- name: Read installed Lego version
  ansible.builtin.command: /usr/local/bin/lego --version
  register: blocky_lego_version_output
  changed_when: false
  failed_when: false

- name: Set installed Lego version fact
  ansible.builtin.set_fact:
    blocky_lego_installed_version: >-
      {{ blocky_lego_version_output.stdout | default('')
         | regex_search('(?<=lego version )\S+')
         | default('', true) }}

- name: Download Lego binary
  when: blocky_lego_installed_version != blocky_lego_version
  ansible.builtin.get_url:
    url: "{{ blocky_lego_url }}"
    dest: "/tmp/lego.tar.gz"
    mode: "0644"
  args:
    checksum: "sha256:{{ blocky_lego_sha256 }}"

- name: Unarchive Lego binary
  when: blocky_lego_installed_version != blocky_lego_version
  ansible.builtin.unarchive:
    src: "/tmp/lego.tar.gz"
    dest: "/usr/local/bin"
    remote_src: true
    owner: blocky
    group: blocky
    mode: "0755"

- name: Detect Lego v4 account layout
  ansible.builtin.find:
    paths: "{{ blocky_config_path }}/accounts"
    recurse: true
    file_type: directory
    patterns: keys
  register: blocky_lego_v4_layout

- name: Migrate Lego account data to v5 layout
  when:
    - not ansible_check_mode
    - blocky_lego_v4_layout.matched > 0
  ansible.builtin.shell:
    cmd: "set -o pipefail && echo y | /usr/local/bin/lego migrate --path {{ blocky_config_path }}"
    chdir: /tmp
    executable: /bin/bash
  register: blocky_lego_migrate_result
  changed_when: blocky_lego_migrate_result.rc == 0

- name: Obtain Let's Encrypt certificate with Lego (Cloudflare DNS challenge)
  environment:
    CLOUDFLARE_DNS_API_TOKEN: "{{ cloudflare_dns_api_token }}"
  ansible.builtin.command:
    cmd: "{{ blocky_lego_run_cmd }}"
    creates: "{{ blocky_cert_file }}"
  args:
    chdir: "/tmp"
  when: not ansible_check_mode
  register: blocky_lego_run_result
  changed_when: blocky_lego_run_result.rc == 0

- name: Set permissions and ownership for Blocky certificate and key
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: blocky
    mode: "0640"
  loop: ["{{ blocky_cert_file }}", "{{ blocky_key_file }}"]
  notify: Restart blocky

- name: Read installed Blocky version
  ansible.builtin.command: "{{ blocky_install_path }}/blocky version"
  register: blocky_version_output
  changed_when: false
  failed_when: false

- name: Set installed Blocky version fact
  ansible.builtin.set_fact:
    blocky_installed_version: >-
      {{ blocky_version_output.stdout | default('')
         | regex_search('(?<=Version: v)\S+')
         | default('', true) }}

- name: Fetch checksums.txt for the declared Blocky release
  when: blocky_installed_version != blocky_version
  become: false
  register: blocky_checksum_file_content
  delegate_to: localhost
  ansible.builtin.uri:
    url: "{{ blocky_checksums_url }}"
    method: GET
    return_content: true

- name: Extract SHA256 checksum for the Blocky archive from checksums.txt
  when: blocky_installed_version != blocky_version
  delegate_to: localhost
  ansible.builtin.set_fact:
    blocky_checksum_sha256: >-
      {{ blocky_checksum_file_content.content.splitlines()
         | select('contains', blocky_archive_name)
         | first | split() | first }}

- name: Download blocky archive
  when: blocky_installed_version != blocky_version
  ansible.builtin.get_url:
    url: "{{ blocky_archive_url }}"
    dest: "/tmp/{{ blocky_archive_name }}"
    mode: "0644"
    checksum: "sha256:{{ blocky_checksum_sha256 }}"

- name: Expand blocky archive
  when: blocky_installed_version != blocky_version
  ansible.builtin.unarchive:
    src: "/tmp/{{ blocky_archive_name }}"
    dest: "{{ blocky_install_path }}"
    group: blocky
    owner: blocky
    mode: "0755"
    copy: false

- name: Ensure owner and mode of blocky binary
  ansible.builtin.file:
    path: "{{ blocky_install_path }}/blocky"
    group: blocky
    owner: blocky
    mode: "0755"
  notify: Restart blocky

- name: Get Tailscale status for DNS binding
  ansible.builtin.command: tailscale status --json
  register: blocky_tailscale_status_raw
  changed_when: false
  failed_when: false

- name: Set Tailscale IPv4 fact for Blocky
  ansible.builtin.set_fact:
    blocky_tailscale_ipv4: "{{ (blocky_tailscale_status_raw.stdout | from_json).Self.TailscaleIPs | select('match', '^[0-9]+\\.') | first }}"
  when:
    - blocky_tailscale_status_raw.rc == 0
    - (blocky_tailscale_status_raw.stdout | from_json).BackendState == "Running"

- name: Find playbook meta files for tailnet-only domain derivation
  become: false
  delegate_to: localhost
  run_once: true
  ansible.builtin.find:
    paths: "{{ playbook_dir }}"
    patterns: "*.meta.yml"
  register: blocky_meta_files_found

- name: Read playbook meta file contents
  become: false
  delegate_to: localhost
  run_once: true
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ blocky_meta_files_found.files }}"
  register: blocky_meta_slurped

- name: Initialize blocky_tailscale_bound_domains
  run_once: true
  ansible.builtin.set_fact:
    blocky_tailscale_bound_domains: []

- name: Append tailnet-only FQDN per meta with operator-override resolution
  run_once: true
  vars:
    parsed: "{{ item.content | b64decode | from_yaml }}"
    app_name: "{{ item.source | basename | regex_replace('\\.meta\\.yml$', '') }}"
    override_var: "{{ app_name + '_subdomain' }}"
    effective_subdomain: "{{ lookup('vars', override_var, default=parsed.subdomain | default('')) }}"
  ansible.builtin.set_fact:
    blocky_tailscale_bound_domains: "{{ blocky_tailscale_bound_domains + [effective_subdomain + '.' + domain] }}"
  when:
    - parsed.tailnet_only | default(false)
    - effective_subdomain | length > 0
  loop: "{{ blocky_meta_slurped.results }}"
  loop_control:
    label: "{{ item.source | basename }}"

- name: Configure blocky
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ blocky_config_path }}/config.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart blocky

- name: Configure blocky service
  ansible.builtin.template:
    src: blocky.service.j2
    dest: /etc/systemd/system/blocky.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart blocky

- name: Ensure blocky service is enabled and running
  ansible.builtin.systemd:
    name: blocky
    state: started
    daemon_reload: true
    enabled: true

- name: Wait for Blocky to listen on Tailscale interface
  ansible.builtin.wait_for:
    host: "{{ blocky_tailscale_ipv4 }}"
    port: 53
    timeout: 30
  when: blocky_tailscale_ipv4 is defined and blocky_tailscale_ipv4 | length > 0

- name: Configure Tailscale DNS to use Blocky
  when:
    - tailscale_login_server is not defined or tailscale_login_server | length == 0
    - tailscale_api_key is defined and tailscale_api_key | length > 0
    - blocky_tailscale_ipv4 is defined and blocky_tailscale_ipv4 | length > 0
  no_log: true
  block:
    - name: Set Tailscale DNS nameservers to Blocky
      ansible.builtin.uri:
        url: https://api.tailscale.com/api/v2/tailnet/-/dns/nameservers
        method: POST
        url_username: "{{ tailscale_api_key }}"
        url_password: ""
        force_basic_auth: true
        body_format: json
        body:
          dns:
            - "{{ blocky_tailscale_ipv4 }}"
        status_code: 200

    - name: Enable DNS override in Tailscale
      ansible.builtin.uri:
        url: https://api.tailscale.com/api/v2/tailnet/-/dns/preferences
        method: POST
        url_username: "{{ tailscale_api_key }}"
        url_password: ""
        force_basic_auth: true
        body_format: json
        body:
          magicDNS: true
        status_code: 200

- name: Allow incoming connections to Blocky DoT port
  community.general.ufw:
    rule: allow
    port: "{{ blocky_dot_port }}"
    proto: tcp
    state: enabled

- name: Deploy Lego renewal script
  ansible.builtin.template:
    src: lego-renew.sh.j2
    dest: "{{ blocky_config_path }}/lego-renew.sh"
    owner: root
    group: root
    mode: "0700"

- name: Deploy Lego renewal systemd service
  ansible.builtin.template:
    src: lego-renew.service.j2
    dest: /etc/systemd/system/lego-renew.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy Lego renewal systemd timer
  ansible.builtin.copy:
    src: lego-renew.timer
    dest: /etc/systemd/system/lego-renew.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start Lego renewal timer
  ansible.builtin.systemd:
    name: lego-renew.timer
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Ensure Cloudflare DNS A record exists for {{ blocky_subdomain + '.' + domain }}
  ansible.builtin.include_role:
    name: dns_record
  vars:
    dns_record_subdomain: "{{ blocky_subdomain }}"
    dns_record_domain: "{{ domain }}"
    dns_record_cloudflare_api_token: "{{ cloudflare_dns_api_token }}"
