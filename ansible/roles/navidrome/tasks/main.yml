- name: Install and configure Navidrome
  block:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ffmpeg
        state: present
        update_cache: true

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Set installed Navidrome version fact
      ansible.builtin.set_fact:
        navidrome_installed_version: >-
          {{ ansible_facts.packages.navidrome[0].version
             if 'navidrome' in ansible_facts.packages else '' }}

    - name: Download Navidrome .deb package
      when: navidrome_installed_version != navidrome_version
      ansible.builtin.get_url:
        url: "{{ navidrome_deb_url }}"
        dest: "/tmp/navidrome_{{ navidrome_version }}_linux_amd64.deb"
        mode: "0644"

    - name: Install Navidrome from .deb package
      when: navidrome_installed_version != navidrome_version
      ansible.builtin.apt:
        deb: "/tmp/navidrome_{{ navidrome_version }}_linux_amd64.deb"
        state: present
      notify: Restart navidrome

    - name: Add ansible user to navidrome group for music uploads
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: "{{ navidrome_sys_group }}"
        append: true

    - name: Ensure music folder has correct permissions after install
      ansible.builtin.file:
        path: "{{ navidrome_music_folder }}"
        state: directory
        owner: "{{ navidrome_sys_user }}"
        group: "{{ navidrome_sys_group }}"
        mode: "2775"
        recurse: false

    - name: Set ownership for Navidrome data directory
      ansible.builtin.file:
        path: /var/lib/navidrome
        state: directory
        owner: "{{ navidrome_sys_user }}"
        group: "{{ navidrome_sys_group }}"
        mode: "0755"
        recurse: true

    - name: Deploy Navidrome configuration file
      ansible.builtin.template:
        src: templates/navidrome.toml.j2
        dest: "/etc/navidrome/navidrome.toml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart navidrome

    - name: Create Navidrome systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/navidrome.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy Navidrome memory budget drop-in
      ansible.builtin.template:
        src: templates/memory.conf.j2
        dest: /etc/systemd/system/navidrome.service.d/memory.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart navidrome

    - name: Deploy Navidrome start limit drop-in
      ansible.builtin.copy:
        src: files/start-limit.conf
        dest: /etc/systemd/system/navidrome.service.d/start-limit.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart navidrome

    - name: Enable and start Navidrome service
      ansible.builtin.systemd_service:
        name: navidrome
        enabled: true
        state: started
        daemon_reload: true

    - name: Deploy Navidrome Caddyfile
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: "/etc/caddy/sites/{{ navidrome_domain }}.caddyfile"
        owner: root
        group: root
        mode: "0644"
      notify: Restart caddy

    - name: Ensure Cloudflare DNS A record exists for {{ navidrome_subdomain + '.' + domain }}
      ansible.builtin.include_role:
        name: dns_record
      vars:
        dns_record_subdomain: "{{ navidrome_subdomain }}"
        dns_record_domain: "{{ domain }}"
        dns_record_cloudflare_api_token: "{{ cloudflare_dns_api_token }}"
