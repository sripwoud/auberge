- name: System Update and Upgrade
  block:
    - name: Install gnupg first (required for apt repository management)
      ansible.builtin.apt:
        name: gnupg
        state: present
        update_cache: true

    - name: Add Debian Testing repository (for specific packages like dasel and bind9)
      when: ansible_facts['distribution'] == "Debian"
      ansible.builtin.copy:
        content: |
          deb http://deb.debian.org/debian/ testing main contrib non-free non-free-firmware
        dest: /etc/apt/sources.list.d/debian-testing.list
        owner: root
        group: root
        mode: "0644"
    - name: Configure APT pinning for dasel (prefer testing over stable)
      when: ansible_facts['distribution'] == "Debian"
      ansible.builtin.copy:
        content: |
          Package: dasel
          Pin: release a=testing
          Pin-Priority: 990

          Package: *
          Pin: release a=testing
          Pin-Priority: 50
        dest: /etc/apt/preferences.d/dasel_pinning.pref
        owner: root
        group: root
        mode: "0644"
    - name: Remove obsolete golang-1.24 APT pinning (trixie is now stable)
      when: ansible_facts['distribution'] == "Debian"
      ansible.builtin.file:
        path: /etc/apt/preferences.d/golang-1.24.pref
        state: absent
    - name: Set up APT pinning for bind9 packages
      when: ansible_facts['distribution'] == "Debian"
      ansible.builtin.copy:
        content: |
          Package: bind9-libs bind9-dnsutils bind9-host
          Pin: release a=testing
          Pin-Priority: 990
        dest: /etc/apt/preferences.d/bind9.pref
        owner: root
        group: root
        mode: "0644"
    - name: Pin apache2 out of reach so php cannot pull it in
      # `php8.4` depends on `libapache2-mod-php8.4 | php8.4-fpm | php8.4-cgi`,
      # and apt takes the first alternative, so installing `php` drags in
      # apache2 — whose postinst starts it against a port caddy already holds.
      # It fails, latches, and the removal below then takes the unit file away
      # and leaves the failure behind (#636).
      #
      # Removal alone cannot close that: this role runs in infrastructure.yml,
      # which every deploy walks *before* the app playbooks, so the roles that
      # install php (baikal, yourls) create the latch after the cleanup has
      # already run and it survives until the next deploy. The same ordering is
      # what makes prevention land in time.
      #
      # Priority -1 makes a package uninstallable rather than merely
      # unattractive, so the alternative resolves to php8.4-fpm. `apache2-utils`
      # is a separate package with no dependency on apache2 and stays
      # installable. Measured against an empty package DB on auberge: a fresh
      # `php php-fpm` install pulls apache2, apache2-bin, apache2-data and
      # libapache2-mod-php without this file, and none of them with it.
      when: ansible_facts['distribution'] == "Debian"
      ansible.builtin.copy:
        content: |
          Package: apache2 apache2-bin apache2-data
          Pin: release *
          Pin-Priority: -1

          Package: libapache2-mod-php*
          Pin: release *
          Pin-Priority: -1
        dest: /etc/apt/preferences.d/no-apache2.pref
        owner: root
        group: root
        mode: "0644"
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
    - name: Upgrade dist
      ansible.builtin.apt:
        upgrade: dist
    - name: Install packages
      ansible.builtin.apt:
        pkg: [
          acl,
          curl,
          dasel,
          dnsutils,
          git,
          golang-1.24,
          lsof,
          rsync,
          vim,
          wget,
        ]
    - name: Create symlink for 'go' binary in /usr/local/bin
      ansible.builtin.file:
        src: /usr/lib/go-1.24/bin/go
        dest: /usr/local/bin/go
        state: link
        force: true
        owner: root
        group: root

- name: Configure Automatic Security Updates
  block:
    - name: Install unattended-upgrades and apt-listchanges
      ansible.builtin.apt:
        pkg:
          - unattended-upgrades
          - apt-listchanges
        state: present

    - name: Configure unattended-upgrades settings
      ansible.builtin.copy:
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}";
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
              "${distro_id}:${distro_codename}-updates";
          };
          Unattended-Upgrade::DevRelease "false";
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::MinimalSteps "true";
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";
          Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
          Unattended-Upgrade::Automatic-Reboot-Time "03:00";
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: "0644"

    - name: Enable automatic updates
      ansible.builtin.copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"

    - name: Configure dpkg to use new config files by default
      ansible.builtin.copy:
        content: |
          Dpkg::Options {
              "--force-confdef";
              "--force-confold";
          };
        dest: /etc/apt/apt.conf.d/10dpkg-options
        owner: root
        group: root
        mode: "0644"

- name: Remove Apache2 web server (conflicts with Caddy)
  block:
    - name: Stop Apache2 service
      ansible.builtin.systemd_service:
        name: apache2
        state: stopped
      failed_when: false
      register: apt_apache2_stop

    - name: Disable Apache2 service
      ansible.builtin.systemd_service:
        name: apache2
        enabled: false
      failed_when: false
      when: apt_apache2_stop.status is defined

    - name: Remove Apache2 packages (keep apache2-utils)
      ansible.builtin.apt:
        name:
          - apache2
          - apache2-bin
          - apache2-data
          - libapache2-mod-php8.4
        state: absent
        autoremove: true
        purge: true
      register: apt_apache2_remove

    - name: Clear Apache2's residual failed state
      # The pin above stops a fresh box ever reaching this state. This is for
      # the boxes that already did: a latched `failed` on a unit whose file the
      # purge removed, which `systemctl --failed` reports forever on a host
      # that has no apache2 (#635, #636). auberge carried one from 2026-08-21.
      #
      # There is no module for reset-failed, and ansible-lint rejects reading
      # the state with `systemctl is-failed`, so idempotence rests on rc: past
      # the purge the unit file is gone, so apache2.service is loaded only if
      # residual state holds it there. rc 0 therefore means a latch was
      # cleared, and rc 1 (`not loaded`) is the steady state. Measured on
      # auberge against the live latch: rc 0, then rc 1 on the second run.
      ansible.builtin.command: systemctl reset-failed apache2.service
      register: apt_apache2_reset
      changed_when: apt_apache2_reset.rc == 0
      failed_when: false

    - name: Ensure apache2-utils is still installed
      ansible.builtin.apt:
        name: apache2-utils
        state: present
