gokapi_install_path: /opt/gokapi
gokapi_data_dir: /var/lib/gokapi
gokapi_config_dir: /var/lib/gokapi/config
gokapi_sys_user: gokapi
gokapi_sys_group: gokapi
gokapi_port: 53842
gokapi_domain: "{{ gokapi_subdomain }}.{{ domain }}"
gokapi_redirect_url: "/admin"
gokapi_max_file_size_mb: 102400
gokapi_max_memory_mb: 50
gokapi_public_name: "Partage"
gokapi_custom_dir: "{{ gokapi_data_dir }}/custom"
# Rendered into custom/version.txt, which Gokapi reads at startup and embeds in
# the stylesheet filename it serves (/custom/custom.v<N>.css). Gokapi sets a
# 2-day Cache-Control on custom assets, so bump this on any edit under custom/.
gokapi_custom_assets_revision: 2
gokapi_archive_url: "https://github.com/Forceu/Gokapi/releases/download/v{{ gokapi_version }}/gokapi-{{ gokapi_version }}_linux-amd64.zip"
gokapi_archive_sha256: "51dbf724c94f8afa0b40fb1ef63a1fe418e7996e7b9536e1f0a5da695b8e18ef"
gokapi_bootstrap_marker: "{{ gokapi_data_dir }}/.bootstrap_done"
