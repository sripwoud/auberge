- name: Restart immich
  ansible.builtin.systemd_service:
    name: immich
    state: restarted
    daemon_reload: true

- name: Restart caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: restarted

- name: Restart immich-backup timer
  ansible.builtin.systemd_service:
    name: immich-backup.timer
    state: restarted
    daemon_reload: true
