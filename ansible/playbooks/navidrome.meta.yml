required_keys:
  - navidrome_subdomain
subdomain: navidrome
memory:
  navidrome: { high: 256M, max: 384M }
version:
  value: "0.63.2"
  datasource: github-releases
  depName: "navidrome/navidrome"
  extractVersion: "^v(?<version>.+)$"
backup:
  systemd_services: [navidrome]
  paths: [/var/lib/navidrome, /etc/navidrome]
  owner: [navidrome, navidrome]
  restore_advice: "may need a music library rescan — trigger one from the web UI or restart the service"
  parameters:
    include_music:
      default: false
      adds_paths: [/srv/music]
units: [navidrome]
