---
- name: Core Infrastructure - Layer 2
  hosts: vps
  become: true
  roles:
    - role: localization
      tags: [infrastructure, system, localization]
    - role: swap
      tags: [infrastructure, system, swap]
    - role: apt
      tags: [infrastructure, packages, apt]
    - role: bash
      vars:
        bash_user_name: "{{ admin_user_name }}"
        bash_user_home: "/home/{{ admin_user_name }}"
      tags: [infrastructure, shell, bash]
    - role: caddy
      tags: [infrastructure, web, proxy, caddy]
      vars:
        # A Cloudflare token is zone-scoped, so the Host serving the agent tier
        # answers DNS-01 for the agent tier's zone and must never hold the
        # parent domain's token (ADR-0068). `aoe_subdomain` is that Host's
        # serving gate — config alone answers it and a blank value is no answer
        # (ADR-0051) — scoped under `[hosts.<name>]` like every other one
        # (ADR-0058). Jinja evaluates only the branch it takes, so an operator
        # with no agent tier never reads the token they never minted.
        caddy_dns_api_token: >-
          {{ agents_cloudflare_dns_api_token
             if aoe_subdomain | default('') | trim | length > 0
             else cloudflare_dns_api_token }}
    - role: blocky
      tags: [infrastructure, network, dns, blocky]
      when: blocky_subdomain is defined and blocky_subdomain | length > 0
    - role: headscale
      tags: [infrastructure, network, vpn, headscale]
      when: headscale_subdomain is defined and headscale_subdomain | length > 0
    - role: tailscale
      tags: [infrastructure, network, vpn, tailscale]

  post_tasks:
    - name: Verify caddy ingress survived this deploy
      ansible.builtin.include_role:
        name: ingress_gate
        apply:
          tags: [always]
      tags: [always]

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
