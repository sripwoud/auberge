---
- name: Deploy Immich
  hosts: vps
  become: true
  roles:
    - role: docker
      tags: [immich, docker]
    - role: immich
      tags: [immich]

  post_tasks:
    - name: Verify caddy ingress survived this deploy
      ansible.builtin.include_role:
        name: ingress_gate
        apply:
          tags: [always]
      tags: [always]
