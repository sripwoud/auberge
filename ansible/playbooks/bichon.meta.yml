required_keys:
  - bichon_api_token
  - bichon_encryption_password
tailnet_only: true
subdomain: bichon
version:
  value: "2.0.3"
  datasource: github-releases
  depName: "rustmailer/bichon"
backup:
  systemd_services: [bichon-archive.timer, bichon]
  paths: [/var/lib/bichon-archive, /opt/bichon/data]
  owner: [bichon, bichon]
units:
  - bichon
  - bichon-archive
  - bichon-archive.timer
  - bichon-uidvalidity-watch
  - bichon-uidvalidity-watch.timer
