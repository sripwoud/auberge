required_keys: []
subdomain: grimmory
memory:
  grimmory: { high: 1100M, max: 1200M }
version:
  value: "2.3.0"
  datasource: github-releases
  depName: "sripwoud/auberge"
  extractVersion: "^grimmory/v(?<version>.+)$"
backup:
  systemd_services: [grimmory]
  paths: [/srv/grimmory, /srv/books]
  attests: sudo mariadb -N -B -e 'select path from library_path' grimmory
  owner: [grimmory, grimmory]
  db:
    name: grimmory
    engine: mariadb
    dump_path: /tmp/grimmory_db.dump
