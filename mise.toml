[tasks.build]
alias = "b"
description = "Build"
run = "cargo build --release"
silent = true

[tasks.auberge]
alias = "a"
depends = "build"
description = "Run auberge"
raw = true
run = "{{ vars.auberge_cli }}"
silent = true

[tasks.fmt]
alias = "f"
description = "Format"
run = "dprint fmt -c .dprint.jsonc"
silent = true

[tasks.lint-ansible]
run = "ansible-lint"
dir = "ansible"
quiet = true

[tasks.lint-rust]
run = "cargo clippy"
quiet = true

[tasks.lint-shell]
run = [
  "shellcheck $(git ls-files '*.sh')",
  "shfmt -d --apply-ignore $(git ls-files '*.sh')",
]
quiet = true

[tasks.lint]
alias = "l"
depends = "lint-*"
quiet = true

[tasks.test-python]
run = "uv run --python 3.13 --with pytest --with icalendar --with recurring-ical-events --with caldav pytest ansible/roles/baikal/files"
quiet = true

[tasks.test-rust]
run = "cargo nextest run"
quiet = true

[tasks.test-shell]
run = [
  "./tests/bichon-archive.test.sh",
  "./tests/bichon-expunge.test.sh",
  "./tests/bichon-uidvalidity-watch.test.sh",
  "./tests/immich-b2-prune.test.sh",
  "./tests/immich-backup.test.sh",
]
quiet = true

[tasks.test]
alias = "t"
depends = "test-*"
quiet = true

[tools]
caddy = "latest"
"cargo:convco" = "latest"
dasel = "latest"
dprint = "latest"
hk = "latest"
pipx = "latest"
pkl = "latest"
ansible = "latest"
"pipx:ansible-dev-tools" = "latest"
"pipx:ansible-lint" = "latest"
rust = "latest"
shellcheck = "latest"
shfmt = "latest"
uv = "latest"
"cargo:cargo-nextest" = "latest"
"npm:docsify-cli" = "latest"

[vars]
auberge_cli = "cargo run --release"
