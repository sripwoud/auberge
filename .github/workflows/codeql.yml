name: codeql
permissions:
  contents: read
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      # The Rust extractor enables the `test` cfg atom unless told otherwise, so
      # literals that exist only to drive a unit test raise findings — three of
      # ours on production lines that cannot reach them; `-` disables an atom.
      # codeql-action exposes no extractor-option input, and this variable is the
      # extractor's own config channel. Job-level: `build-mode: none` extracts
      # under `analyze`, not `init`. Inert on the actions and python legs, which
      # never spawn this extractor. See ADR-0048.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: "-test"
    strategy:
      fail-fast: false
      matrix:
        # Mirror the languages default setup scanned (actions, python, rust) so
        # switching to advanced setup does not drop coverage.
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
